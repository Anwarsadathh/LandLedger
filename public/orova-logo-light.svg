<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 42 742 156" role="img" aria-label="OROVA real estate logo">
<style>
  .mark{stroke:#E0A24A;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:440;stroke-dashoffset:440;animation:draw 1.7s cubic-bezier(.2,.7,.2,1) forwards}
  .name{font-family:'Helvetica Neue',Arial,sans-serif;font-size:126px;font-weight:500;letter-spacing:9px;fill:#ffffff;opacity:0;animation:appear 1.1s .75s ease forwards}
  .line{stroke:#E0A24A;stroke-width:3;stroke-dasharray:210;stroke-dashoffset:210;animation:draw 1.1s 1.25s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}@keyframes appear{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.mark,.line{stroke-dashoffset:0;animation:none}.name{opacity:1;animation:none}}
</style>
<g transform="translate(42 39)">
<path class="mark" d="M18 139 V65 L85 13 L152 65 V139 H18 M58 139 V86 H112 V139 M85 13 V86"/>
<path class="line" d="M2 155 H168"/>
</g>
<text class="name" x="245" y="171">OROVA</text>
</svg>
